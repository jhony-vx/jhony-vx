    <clipPath id="avatarClipL"><circle cx="1080" cy="130" r="64"/></clipPath>

    <linearGradient id="textGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
